# A Plone site for the integration tests, started by pytest-docker.
# Run them with: make test-integration
services:
  plone:
    image: ${PLONE_IMAGE:-plone/plone-backend:6.1}
    environment:
      SITE: Plone
      TYPE: volto
    ports:
      - "8080"
  volto:
    image: ${VOLTO_IMAGE:-plone/plone-frontend:19.6.1}
    environment:
      RAZZLE_INTERNAL_API_PATH: http://plone:8080/Plone
    ports:
      - "3000"
    depends_on:
      - plone
