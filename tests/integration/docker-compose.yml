version: "3.8"

# Used by pytest-docker to spin up a real Plone instance for integration tests.
# Run integration tests with:
#   pytest -m integration tests/integration/

services:
  plone:
    image: ${PLONE_DOCKER_IMAGE:-ghcr.io/plone/demo-backend:latest}
    ports:
      - "55001:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/Plone"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
