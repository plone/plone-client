# A Plone site with Volto and sample content, for tutorials and tests.
#
#   docker compose up --wait     start it; Volto answers at http://localhost:3000
#   docker compose down -v       stop it and throw everything away
#
# PLONE_PORT and VOLTO_PORT change the ports on your computer.
# make test-integration and make docs-check use this file too.
services:
  plone:
    image: ${PLONE_IMAGE:-plone/plone-backend:6.1}
    environment:
      SITE: Plone
      TYPE: volto
    ports:
      - "${PLONE_PORT:-8080}:8080"
  volto:
    image: ${VOLTO_IMAGE:-plone/plone-frontend:19.6.1}
    environment:
      RAZZLE_INTERNAL_API_PATH: http://plone:8080/Plone
    ports:
      - "${VOLTO_PORT:-3000}:3000"
    depends_on:
      plone:
        condition: service_healthy
  # Creates the sample content once, and exits.
  seed:
    image: ghcr.io/astral-sh/uv:0.9-python3.13-alpine
    command:
      - uv
      - run
      - ${SEED_SCRIPT:-https://raw.githubusercontent.com/plone/plone-client/main/docs/_checks/seed.py}
    environment:
      PLONE_CLIENT_URL: http://plone:8080/Plone
      PLONE_CLIENT_USERNAME: admin
      PLONE_CLIENT_PASSWORD: admin
    volumes:
      - .:/repository:ro
    depends_on:
      plone:
        condition: service_healthy
  # The MCP server over HTTP: docker compose --profile mcp up --wait
  # Clients send the token in $PLONE_CLIENT_MCP_TOKEN, of 32 characters or more.
  mcp:
    profiles: [mcp]
    image: ghcr.io/astral-sh/uv:0.9-python3.13-alpine
    command: uvx --from plone-client[mcp] plone-client mcp --http --host 0.0.0.0
    environment:
      PLONE_CLIENT_URL: http://plone:8080/Plone
      PLONE_CLIENT_USERNAME: admin
      PLONE_CLIENT_PASSWORD: admin
      PLONE_CLIENT_FRONTEND_URL: http://volto:3000
      PLONE_CLIENT_MCP_TOKEN: ${PLONE_CLIENT_MCP_TOKEN:-}
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    depends_on:
      plone:
        condition: service_healthy
