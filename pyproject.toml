[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "plone-client"
dynamic = ["version"]
description = "Python library and command line client for Plone sites, built on plone.restapi"
readme = "README.md"
license = "GPL-2.0-only"
license-files = ["LICENSE.GPL"]
requires-python = ">=3.11"
authors = [{ name = "Érico Andrei", email = "ericof@plone.org" }]
keywords = ["plone", "rest", "api", "cms", "client", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Plone",
    "Framework :: Plone :: 6.0",
    "Framework :: Plone :: 6.1",
    "Framework :: Plone :: 6.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
cli = [
    "keyring>=25.0.0",
    "tomlkit>=0.13.0",
    "typer>=0.15.0",
]
# collective.html2blocks needs Python 3.12; on 3.11 the conversion is refused
markdown = [
    "collective.html2blocks>=1.0.0a9; python_version >= '3.12'",
]
mcp = [
    "plone-client[cli]",
    "mcp>=2.3.0",
]

[project.scripts]
plone-client = "plone_client.cli:main"

[project.urls]
Homepage = "https://github.com/plone/plone-client"
Documentation = "https://plone.github.io/plone-client"
Repository = "https://github.com/plone/plone-client"
Issues = "https://github.com/plone/plone-client/issues"
Changelog = "https://github.com/plone/plone-client/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-docker>=3.1.0",
]
lint = [
    "mypy>=1.13.0",
]
docs = [
    "linkify-it-py>=2.0.3",
    "myst-parser>=4.0.0",
    "packaging>=24.0",
    "plone-sphinx-theme>=1.4.3",
    "sphinx>=8.0.0",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-notfound-page>=1.0.4",
    "sphinx-sitemap>=2.6.0",
    "sphinxext-opengraph>=0.9.1",
    "vale>=3.9.0",
]
release = [
    "towncrier>=24.8.0",
    "zest-releaser[recommended]>=9.5.0",
    "zestreleaser-towncrier>=1.3.0",
]

[tool.uv]
default-groups = ["test", "lint"]

[tool.hatch.version]
path = "src/plone_client/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/docs/_build"]

[tool.hatch.build.targets.wheel]
packages = ["src/plone_client"]

[tool.towncrier]
package = "plone_client"
package_dir = "src"
directory = "news/"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
template = "news/.changelog_template.jinja"
issue_format = "[#{issue}](https://github.com/plone/plone-client/issues/{issue})"
underlines = ["", "", ""]

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking changes:"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "New features:"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bug fixes:"
showcontent = true

[[tool.towncrier.type]]
directory = "internal"
name = "Internal:"
showcontent = true

[[tool.towncrier.type]]
directory = "documentation"
name = "Documentation:"
showcontent = true

[[tool.towncrier.type]]
directory = "tests"
name = "Tests"
showcontent = true

[tool.ruff]
line-length = 88
target-version = "py311"
fix = true
lint.select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
]
lint.ignore = [
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.isort]
case-sensitive = false
no-sections = true
force-single-line = true
from-first = true
lines-after-imports = 2
lines-between-types = 1
order-by-type = false

[tool.ruff.format]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "RUF001", "S101", "S105", "S106", "S107"]
"docs/_examples/*" = ["E402", "S101", "S106"]
"docs/conf.py" = ["E402"]
# "secret" names where a secret is kept (keyring, env…), never a secret itself
"src/plone_client/profiles.py" = ["S105", "S107"]
"src/plone_client/credentials.py" = ["S105"]
"src/plone_client/cli/profile.py" = ["S105", "S107"]

[tool.mypy]
python_version = "3.11"
strict = true

# The managers return JSON from the site, typed by its expected shape.
[[tool.mypy.overrides]]
module = ["plone_client.managers.*"]
warn_return_any = false

[[tool.mypy.overrides]]
module = ["keyring.*"]
ignore_missing_imports = true

# collective.html2blocks is optional and not installed on Python 3.11.
[[tool.mypy.overrides]]
module = ["collective.html2blocks.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a running Plone site (started with Docker)",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
source_pkgs = ["plone_client"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
