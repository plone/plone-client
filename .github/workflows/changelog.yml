name: Change log check
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

env:
  python-version: "3.13"

jobs:
  build:
    # Dependabot pull requests, and those labeled "skip changelog", need no news fragment
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && !contains(github.event.pull_request.labels.*.name, 'skip changelog') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch all history
          fetch-depth: "0"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ env.python-version }}

      - name: Check for presence of a Change Log fragment
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "${BASE_BRANCH}"
          uvx towncrier check --compare-with "origin/${BASE_BRANCH}" --config pyproject.toml --dir .
