name: Documentation checks

# The pages run once a week against the Plone releases whose output they show,
# so that a new release of an image cannot break a tutorial unnoticed. Plone 6.0
# answers with other fields (no preview_image_link, fewer metadata columns);
# the integration tests cover it, and reference/compatibility.md lists the
# differences.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  pages:
    name: "Pages: ${{ matrix.image }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "plone/plone-backend:6.2"
          - "plone/plone-backend:6.1"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Run the pages
        env:
          PLONE_IMAGE: ${{ matrix.image }}
        run: make docs-check

      # Runs even when a page failed, so one run reports both.
      - name: Check the service examples
        if: ${{ !cancelled() }}
        env:
          PLONE_IMAGE: ${{ matrix.image }}
        run: make docs-services-check

  demo:
    name: "demo.plone.org"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true

      # An outage of the demo site must not fail anything.
      - name: Run the pages that read the demo site
        continue-on-error: true
        run: make docs-check DEMO=1 PAGE="index.md start/script.md start/cli.md"
