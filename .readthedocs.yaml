# Read the Docs builds a preview of the documentation for each pull request.
# The published documentation stays on GitHub Pages (.github/workflows/docs.yml),
# so this project on Read the Docs is for previews only.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    # Skip a pull request that changes nothing the documentation is built
    # from. Exit code 183 cancels the build on Read the Docs.
    - |
      if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet origin/main -- docs/ src/ .readthedocs.yaml Makefile pyproject.toml uv.lock;
      then
        exit 183;
      fi
    - python -m pip install uv
    # The same strict build as make docs, written to $READTHEDOCS_OUTPUT/html.
    - make docs-rtd
